services:
  backend:
    image: ${IMAGE_TAG:-ghcr.io/your_github_username/trading-backend:latest}
    container_name: trading-backend
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
      - ./kis_devlp.yaml:/app/kis_devlp.yaml:ro
    environment:
      - TZ=Asia/Seoul

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./.nginx/conf.d:/etc/nginx/templates:ro
      - ./.nginx/certbot/conf:/etc/letsencrypt:ro
      - ./.nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul
      - DOMAIN=${DOMAIN}

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./.nginx/certbot/conf:/etc/letsencrypt
      - ./.nginx/certbot/www:/var/www/certbot
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: >
      /bin/sh -c '
      apk add --no-cache docker-cli;
      trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --deploy-hook "docker exec nginx-proxy nginx -s reload";
        sleep 12h & wait $${!};
      done;
      '